<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tripp Higgins Raspberry Pi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #1e2a38 0%, #16202b 100%);
      color: #f2f5f7;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
    }
    .pi {
      font-size: 40px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 28px;
      color: #a9b6c2;
      font-size: 0.95rem;
    }
    a.button {
      display: inline-block;
      padding: 12px 28px;
      background: #2ea043;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    a.button:hover {
      background: #3fb950;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="pi">🙂</div>
    <h1>Tripp Higgins Raspberry Pi</h1>
    <p>Project homepage</p>
    <a class="button" href="https://github.com/LittleTripper/tripp_raspberrypi_prject">View on GitHub</a>
  </div>
</body>
</html>
